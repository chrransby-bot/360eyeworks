name: Opdater prisliste i Notion

on:
  schedule:
    - cron: "17 4 * * 1-5" # hverdage ca. 06:17 dansk tid
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PRISLISTE_ID: ${{ secrets.NOTION_PRISLISTE_ID }}
      PRISFIL_URL: ${{ secrets.PRISFIL_URL }}
      STANDARD_AVANCE: ${{ vars.STANDARD_AVANCE }}
    steps:
      - uses: actions/checkout@v4
      - name: Tjek at hemmeligheder er sat
        id: tjek
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_PRISLISTE_ID" ] || [ -z "$PRISFIL_URL" ]; then
            echo "Hemmeligheder mangler (se tilbud/README.md). Springer over."
            echo "klar=nej" >> "$GITHUB_OUTPUT"
          else
            echo "klar=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Opdater Prisliste
        if: steps.tjek.outputs.klar == 'ja'
        run: python3 tilbud/sync_prisliste.py
